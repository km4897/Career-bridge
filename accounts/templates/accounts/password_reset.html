{% extends "base.html" %}
{% block title %}Reset Password — CareerBridge{% endblock %}
{% block content %}
<div class="cb-form-page">
  <div class="cb-form-card">
    <h1>Reset your password</h1>
    <p class="cb-form-subtitle">We'll email you instructions to reset it.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-lg mt-2">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
