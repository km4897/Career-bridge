{% extends "base.html" %}
{% block title %}Register — CareerBridge{% endblock %}
{% block content %}
<div class="cb-form-page">
  <div class="cb-form-card">
    <h1>Create your account</h1>
    <p class="cb-form-subtitle">Join CareerBridge as an applicant or employer.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-lg mt-2">Register</button>
    </form>
    <p class="cb-form-footer">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
