{% extends "base.html" %}
{% block title %}Login — CareerBridge{% endblock %}
{% block content %}
<div class="cb-form-page">
  <div class="cb-form-card">
    <h1>Welcome back</h1>
    <p class="cb-form-subtitle">Log in to your CareerBridge account.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-lg mt-2">Log in</button>
    </form>
    <p class="cb-form-footer">
      <a href="{% url 'accounts:password_reset' %}">Forgot password?</a> ·
      New here? <a href="{% url 'accounts:register' %}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
