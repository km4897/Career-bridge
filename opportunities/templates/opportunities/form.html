{% extends "base.html" %}
{% block title %}{{ mode }} Opportunity — CareerBridge{% endblock %}
{% block content %}
<div class="cb-form-page">
  <div class="cb-form-card cb-form-card-wide">
    <h1>{{ mode }} Opportunity</h1>
    <p class="cb-form-subtitle">Fill in the details applicants will see.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-lg mt-2">Save</button>
    </form>
    <p class="cb-form-footer"><a href="{% url 'opportunities:my_opportunities' %}">Cancel</a></p>
  </div>
</div>
{% endblock %}
