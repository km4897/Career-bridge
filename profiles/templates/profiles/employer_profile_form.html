{% extends "app_base.html" %}
{% block title %}Organisation Profile — CareerBridge{% endblock %}
{% block app_content %}
<div class="cb-form-card cb-form-card-wide" style="max-width: 700px;">
  <h1>Organisation Profile</h1>
  <p class="cb-form-subtitle">This is what applicants see when they view your postings.</p>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-lg mt-2">Save Profile</button>
  </form>

  {% if profile.logo %}
    <hr class="my-4">
    <p class="fw-semibold mb-2">Current logo</p>
    <img src="{{ profile.logo.url }}" alt="Logo" style="max-height:80px;">
  {% endif %}
</div>
{% endblock %}
