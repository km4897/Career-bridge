{% extends "base.html" %}
{% block title %}Organisation Profile — CareerBridge{% endblock %}
{% block content %}
<h1 class="mb-4">Organisation Profile</h1>
<form method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Save Profile</button>
</form>

{% if profile.logo %}<p class="mt-3"><img src="{{ profile.logo.url }}" alt="Logo" style="max-height:80px;"></p>{% endif %}
{% endblock %}
